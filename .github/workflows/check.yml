name: Stowaway checks
on:
  pull_request:
  push:
    branches:
      - main
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run epub:host-report
      - run: npx expo install --check
      - run: npx expo export --platform ios
        env:
          CI: '1'
          EXPO_PUBLIC_STOWAWAY_BUILD_AUDIENCE: public
          EXPO_PUBLIC_STOWAWAY_EPUB_DIAGNOSTIC: disabled
      - run: npx expo export --platform ios --output-dir dist/epub-internal
        env:
          CI: '1'
          EXPO_PUBLIC_STOWAWAY_BUILD_AUDIENCE: internal-personal
          EXPO_PUBLIC_STOWAWAY_EPUB_DIAGNOSTIC: enabled
